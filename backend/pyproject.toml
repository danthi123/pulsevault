[project]
name = "pulsevault-backend"
version = "0.1.0"
description = "Self-hosted Garmin/Gadgetbridge-style watch dashboard — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",      # file uploads (FIT)
    "itsdangerous>=2.2",             # signed session cookies
    "apscheduler>=3.10",             # periodic Garmin sync
    "garminconnect>=0.2.19",         # unofficial Garmin Connect client (pulls in garth)
    "fitdecode>=0.10.0",             # FIT file parsing
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
