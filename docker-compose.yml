# PulseVault — self-hosted Garmin/Gadgetbridge-style watch dashboard.
# One command:  docker compose up --build -d
# Then open the proxy (default http://localhost:8080).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      GARMIN_EMAIL: ${GARMIN_EMAIL}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES}
      INITIAL_BACKFILL_DAYS: ${INITIAL_BACKFILL_DAYS}
      TZ: ${TZ}
    volumes:
      # Persists the auto-refreshing Garmin token cache across restarts.
      - garth-tokens:/data/garth
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    restart: unless-stopped
    # The built static bundle is served by the proxy; this service just holds it.
    # (Multi-stage build outputs to an nginx-less busybox that the proxy reads via a shared volume.)
    volumes:
      - frontend-dist:/dist

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${PROXY_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend-dist:/srv/www:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  garth-tokens:
  frontend-dist:
  caddy-data:
  caddy-config:
