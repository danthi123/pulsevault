# PulseVault — self-hosted Garmin/Gadgetbridge-style watch dashboard.
# One command:  docker compose up --build -d   → open http://localhost:8080
#
# The frontend image serves the SPA and reverse-proxies /api to the backend, so
# it's the single web entrypoint (no separate proxy container). Deploy behind
# your own TLS (see the homelab stack's compose.yml + central Caddy for the
# convention-aligned production layout).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_USERNAME: ${APP_USERNAME}
      APP_PASSWORD: ${APP_PASSWORD}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      GARMIN_EMAIL: ${GARMIN_EMAIL}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES}
      INITIAL_BACKFILL_DAYS: ${INITIAL_BACKFILL_DAYS}
      TZ: ${TZ}
    volumes:
      # Persists the auto-refreshing Garmin token cache across restarts.
      - garth-tokens:/data/garth
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PROXY_PORT:-8080}:80"

volumes:
  db-data:
  garth-tokens:
