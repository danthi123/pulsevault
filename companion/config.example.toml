# PulseVault companion config. Copy to config.toml (kept next to the binary).
# Env overrides: PV_SERVER_URL, PV_TOKEN, PV_POLL_INTERVAL, PV_CONFIG.

server_url = "http://localhost:8080"   # your PulseVault server (https in prod)
token = "PASTE_INGEST_TOKEN_HERE"      # from the web UI: Settings -> Device Sync
poll_interval = 60                     # seconds between cycles

# Inbox folder (relative to the binary). Every .fit here is uploaded and then
# DELETED on success. Drop files in manually any time.
fit_dir = "FIT"

# Auto-pull new .fit off the connected watch into the inbox each cycle
# (Linux: gvfs MTP auto-detect; Windows: experimental; else off).
auto_pull = true

# Advanced: extra pull sources (folder trees / explicit MTP mounts) also feed
# the inbox. Usually not needed.
# [[sources]]
# type = "folder"
# path = "~/somewhere/with/fit/files"
