# PulseVault companion agent config. Copy to config.toml and edit.
# Config search order: --config PATH, ./config.toml, ~/.config/pulsevault-companion/config.toml
# Any value can also be overridden by env vars: PV_SERVER_URL, PV_TOKEN, PV_POLL_INTERVAL.

# Your PulseVault server (the proxy URL you open in a browser).
server_url = "http://localhost:8080"

# Ingest token — copy from the web UI: Settings → Device Sync.
token = "PASTE_TOKEN_HERE"

# Seconds between scans for the watch.
poll_interval = 300

verify_tls = true
log_level = "INFO"

# --- Sources are tried in order. Configure one or more. ---

# 1) MTP (default): auto-detect the Fenix when plugged in and auto-mounted.
#    On a Linux desktop this Just Works. Headless or non-gvfs? Mount with
#    jmtpfs/go-mtpfs and point mount_globs at it.
[[sources]]
type = "mtp"
# mount_globs = ["/run/user/1000/gvfs/*"]   # override if auto-detect misses it
# max_depth = 4

# 2) Folder: watch any directory tree for .fit files. Great for Windows
#    (copy from Explorer), MSC watches, or a Syncthing/Nextcloud folder.
# [[sources]]
# type = "folder"
# path = "~/Sync/garmin-fit"

# 3) BLE (experimental — not syncing yet). See `pulsevault-companion ble-probe`.
# [[sources]]
# type = "ble"
# enabled = true
# address = "XX:XX:XX:XX:XX:XX"   # optional; auto-scans by name otherwise
